# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Use AndroidX instead of old support library
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Enables Compose compiler metrics (helpful during development)
# android.enableComposeCompilerMetrics=false

# Non-transitive R classes improve build speed
android.nonTransitiveRClass=true

# Enables the new Dependency Analysis build (safer)


# Gradle JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable configuration caching for faster builds
org.gradle.configuration-cache=false

# Enable build cache
org.gradle.caching=true
